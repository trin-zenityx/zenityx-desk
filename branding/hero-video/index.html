<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 400;
    src: url("fonts/IBMPlexSansThai-Regular.ttf") format("truetype"); }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 500;
    src: url("fonts/IBMPlexSansThai-Medium.ttf") format("truetype"); }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 600;
    src: url("fonts/IBMPlexSansThai-SemiBold.ttf") format("truetype"); }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 700;
    src: url("fonts/IBMPlexSansThai-Bold.ttf") format("truetype"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }

  [data-composition-id="root"] {
    position: relative;
    width: 1920px; height: 1080px;
    background: #ffffff;
    overflow: hidden;
    font-family: "IBM Plex Sans Thai", sans-serif;
    color: #1d1d1f;
  }

  /* ---------- headline: one calm statement at a time, centered, large ---------- */
  .stage { position: absolute; inset: 0; z-index: 2; }
  .stmt {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 0 140px;
  }
  .stmt .inner {
    font-weight: 600; letter-spacing: -0.04em;
    line-height: 1.06; white-space: nowrap; opacity: 0;
  }
  /* each statement sized to command the frame (~65% width) */
  .s1 .inner { font-size: 300px; }
  .s2 .inner { font-size: 238px; }
  .s3 .inner { font-size: 208px; }
  /* surgical accent — only the key verb is red */
  .hot { color: #E8392E; }

  /* ---------- premium resolve ---------- */
  .resolve {
    position: absolute; inset: 0; z-index: 6;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 36px;
    visibility: hidden;
  }
  .lockup { display: flex; align-items: center; gap: 38px; }
  .lockup .app-icon { width: 200px; height: 200px; border-radius: 46px;
    opacity: 0;
    box-shadow: 0 54px 100px rgba(0,0,0,.18), 0 14px 34px rgba(0,0,0,.08); }
  .lockup .wordmark { font-size: 124px; font-weight: 700;
    letter-spacing: -0.04em; color: #1d1d1f; opacity: 0; }
  .rule { width: 460px; height: 6px; background: #E8392E; border-radius: 3px;
          transform: scaleX(0); transform-origin: center; }
  .tagline { font-size: 46px; font-weight: 500; color: #86868b;
             letter-spacing: -0.01em; opacity: 0; }
</style>
</head>
<body>
<div data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="12" data-track-index="0">

  <!-- headline: ติดตรงไหน → ให้ผู้สอนเห็น → และช่วยตรงนั้น -->
  <div class="stage">
    <div class="stmt s1"><div class="inner">ติดตรงไหน</div></div>
    <div class="stmt s2"><div class="inner">ให้ผู้สอน<span class="hot">เห็น</span></div></div>
    <div class="stmt s3"><div class="inner">และ<span class="hot">ช่วย</span>ตรงนั้น</div></div>
  </div>

  <!-- premium resolve lockup -->
  <div class="resolve">
    <div class="lockup">
      <img class="app-icon" src="assets/app-icon.png" alt="">
      <div class="wordmark">ZenityX Desk</div>
    </div>
    <div class="rule"></div>
    <div class="tagline">ให้ผู้สอนช่วยคุณ ถึงหน้าจอ</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* ambient: one slow, calm push across the whole headline phase (Apple-style) */
    tl.fromTo(".stage", { scale: 1.0 }, { scale: 1.035, duration: 9.3, ease: "none" }, 0);

    /* S1 — ติดตรงไหน */
    tl.fromTo(".s1 .inner", { y: 64, opacity: 0 }, { y: 0, opacity: 1, duration: 1.05, ease: "power2.out" }, 0.35);
    tl.to(".s1 .inner", { y: -64, opacity: 0, duration: 0.7, ease: "power2.in" }, 2.8);

    /* S2 — ให้ผู้สอนเห็น (เห็น is red) */
    tl.fromTo(".s2 .inner", { y: 64, opacity: 0 }, { y: 0, opacity: 1, duration: 0.95, ease: "power2.out" }, 3.3);
    tl.to(".s2 .inner", { y: -64, opacity: 0, duration: 0.7, ease: "power2.in" }, 5.9);

    /* S3 — และช่วยตรงนั้น (ช่วย is red) */
    tl.fromTo(".s3 .inner", { y: 64, opacity: 0 }, { y: 0, opacity: 1, duration: 0.95, ease: "power2.out" }, 6.3);
    tl.to(".s3 .inner", { y: -64, opacity: 0, duration: 0.7, ease: "power2.in" }, 8.6);
    tl.set(".stage", { visibility: "hidden" }, 9.35);

    /* Resolve — calm, confident settle (no bounce) */
    tl.set(".resolve", { visibility: "visible" }, 9.2);
    tl.fromTo(".app-icon", { scale: 0.92, y: 26, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 9.25);
    tl.fromTo(".wordmark", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 9.65);
    tl.fromTo(".rule", { scaleX: 0 }, { scaleX: 1, duration: 0.65, ease: "power2.out" }, 10.0);
    tl.fromTo(".tagline", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 10.2);
    tl.to(".app-icon", { y: -8, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 10.7);

    /* fade to white for a seamless loop */
    tl.to(".resolve", { opacity: 0, duration: 0.6, ease: "power2.in" }, 11.35);

    window.__timelines["root"] = tl;
  </script>
</div>
</body>
</html>
