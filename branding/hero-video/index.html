<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 400;
    src: url("fonts/IBMPlexSansThai-Regular.ttf") format("truetype"); }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 600;
    src: url("fonts/IBMPlexSansThai-SemiBold.ttf") format("truetype"); }
  @font-face { font-family: "IBM Plex Sans Thai"; font-weight: 700;
    src: url("fonts/IBMPlexSansThai-Bold.ttf") format("truetype"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; }

  [data-composition-id="root"] {
    position: relative;
    width: 1920px; height: 1080px;
    background: #ffffff;
    overflow: hidden;
    font-family: "IBM Plex Sans Thai", sans-serif;
    color: #1d1d1f;
  }

  /* ---------- headline block ---------- */
  .scene-content {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    padding: 0 150px;
    display: flex; flex-direction: column; justify-content: center;
    gap: 10px;
  }
  .line { font-size: 142px; font-weight: 700; line-height: 1.18;
          letter-spacing: -0.03em; white-space: nowrap; }
  .line .w { display: inline-block; }
  .line .sp { display: inline-block; width: .22em; }

  /* word wrappers that host cursor / circle / marker */
  .anchor { position: relative; display: inline-block; }

  /* hand-drawn red circle around "เห็น" */
  .ring { position: absolute; left: -34px; top: -20px; width: calc(100% + 68px); height: calc(100% + 40px);
          z-index: 3; overflow: visible; pointer-events: none; }
  .ring path { fill: none; stroke: #E8392E; stroke-width: 9; stroke-linecap: round; }

  /* red marker sweep behind "ช่วย" */
  .marker { position: absolute; left: -12px; right: -12px; bottom: 8px; height: 46%;
            background: rgba(232,57,46,.26); border-radius: 6px;
            transform: scaleX(0); transform-origin: left center; z-index: -1; }

  /* teacher cursor (svg arrow + pill label) */
  .cursor { position: absolute; z-index: 5; opacity: 0; }
  .cursor .pill {
    position: absolute; left: 34px; top: 38px;
    background: #B3261E; color: #fff; font-size: 26px; font-weight: 600;
    font-family: "IBM Plex Sans Thai", sans-serif; letter-spacing: 0;
    padding: 6px 18px; border-radius: 8px; white-space: nowrap;
  }
  .cursor-1 { right: -64px; top: -34px; }
  .cursor-2 { right: -58px; top: -26px; }

  /* click ripple on "ช่วย" */
  .ripple { position: absolute; left: 50%; top: 55%; width: 130px; height: 130px;
            margin: -65px 0 0 -65px; border: 6px solid #E8392E; border-radius: 50%;
            opacity: 0; z-index: 3; }

  /* ---------- resolve / lockup ---------- */
  .resolve {
    position: absolute; inset: 0; z-index: 6;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px;
  }
  .owl { width: 300px; opacity: 0; }
  .lockup { display: flex; align-items: center; gap: 22px; opacity: 0; }
  .lockup img { width: 84px; height: 84px; border-radius: 19px; }
  .lockup b { font-size: 84px; font-weight: 700; letter-spacing: -0.03em; }
  .red-rule { width: 320px; height: 6px; background: #E8392E; border-radius: 3px;
              transform: scaleX(0); transform-origin: center; }
  .tagline { font-size: 38px; font-weight: 400; color: #8a8a8e; opacity: 0; }
</style>
</head>
<body>
<div data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="12" data-track-index="0">

  <!-- kinetic headline -->
  <div class="scene-content">
    <div class="line line-1">
      <span class="w w-1a">ติด</span><span class="w w-1b">ตรง</span><span class="w w-1c">ไหน</span>
    </div>
    <div class="line line-2">
      <span class="w w-2a">ให้</span><span class="w w-2b">ผู้สอน</span><span class="sp"></span><span class="anchor a-seen"><span class="w w-2c">เห็น</span>
        <svg class="ring" viewBox="0 0 100 60" preserveAspectRatio="none">
          <path class="ring-path" pathLength="1"
            d="M 50 4 C 76 2, 97 12, 96 30 C 95 49, 73 57, 48 56 C 24 55, 4 47, 4 29 C 4 13, 26 3, 54 5" />
        </svg>
        <span class="cursor cursor-1">
          <svg width="44" height="48" viewBox="0 0 24 26"><path d="M3 1 L3 20 L8 15.5 L11.5 23.5 L15 22 L11.5 14 L18 14 Z" fill="#E8392E" stroke="#ffffff" stroke-width="1.6"/></svg>
          <span class="pill">ผู้สอน</span>
        </span>
      </span>
    </div>
    <div class="line line-3">
      <span class="w w-3a">และ</span><span class="anchor a-help"><span class="w w-3b">ช่วย</span>
        <span class="marker"></span>
        <span class="ripple"></span>
        <span class="cursor cursor-2">
          <svg width="44" height="48" viewBox="0 0 24 26"><path d="M3 1 L3 20 L8 15.5 L11.5 23.5 L15 22 L11.5 14 L18 14 Z" fill="#E8392E" stroke="#ffffff" stroke-width="1.6"/></svg>
          <span class="pill">ผู้สอน</span>
        </span>
      </span><span class="w w-3c">ตรงนั้น</span>
    </div>
  </div>

  <!-- resolve lockup -->
  <div class="resolve">
    <img class="owl" src="assets/m-01-wave.png" alt="">
    <div class="lockup"><img src="assets/app-icon.png" alt=""><b>ZenityX Desk</b></div>
    <div class="red-rule"></div>
    <div class="tagline">เครื่องมือการเรียนแบบ 1:1</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* ---------- line 1: ติดตรงไหน (slide decay) ---------- */
    tl.fromTo(".w-1a", { x: 90, y: 24, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.55, ease: "power4.out" }, 0.55);
    tl.fromTo(".w-1b", { x: 55, y: 18, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.3)" }, 0.74);
    tl.fromTo(".w-1c", { x: 28, y: 12, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 0.92);

    /* ---------- line 2: ให้ผู้สอนเห็น ---------- */
    tl.fromTo(".w-2a", { x: -70, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 2.45);
    tl.fromTo(".w-2b", { x: -44, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 2.62);
    tl.fromTo(".w-2c", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.5)" }, 2.8);

    /* teacher cursor flies in and lands beside "เห็น" */
    tl.fromTo(".cursor-1",
      { x: 720, y: -360, opacity: 0 },
      { x: 0, y: 0, opacity: 1, duration: 0.85, ease: "power4.out" }, 3.45);

    /* hand-drawn red ring around "เห็น" */
    tl.set(".ring-path", { strokeDasharray: 1, strokeDashoffset: 1 }, 0);
    tl.to(".ring-path", { strokeDashoffset: 0, duration: 0.85, ease: "power2.inOut" }, 4.05);

    /* ---------- line 3: และช่วยตรงนั้น ---------- */
    tl.fromTo(".w-3a", { y: 46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 5.3);
    tl.fromTo(".w-3b", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.7)" }, 5.48);
    tl.fromTo(".w-3c", { x: 36, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 5.68);

    /* cursor hops from "เห็น" to "ช่วย" */
    tl.to(".cursor-1", { x: 60, y: 60, opacity: 0, duration: 0.28, ease: "power2.in" }, 5.95);
    tl.set(".cursor-1", { visibility: "hidden" }, 6.3);
    tl.fromTo(".cursor-2",
      { x: 320, y: -220, opacity: 0 },
      { x: 0, y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 6.12);

    /* marker sweep + click ripple on "ช่วย" */
    tl.to(".marker", { scaleX: 1, duration: 0.55, ease: "power3.inOut" }, 6.55);
    tl.fromTo(".cursor-2", { scale: 1 }, { scale: 0.88, duration: 0.12, ease: "power2.inOut", yoyo: true, repeat: 1 }, 6.6);
    tl.fromTo(".ripple", { scale: 0.3, opacity: 0.8 }, { scale: 1.6, opacity: 0, duration: 0.65, ease: "power2.out" }, 6.66);

    /* breathe: gentle drift of the whole block */
    tl.to(".scene-content", { y: -8, duration: 1.4, ease: "sine.inOut" }, 7.0);

    /* ---------- exit headline, resolve to brand ---------- */
    tl.to(".line-1", { y: -90, opacity: 0, duration: 0.45, ease: "power2.in" }, 8.35);
    tl.to(".line-2", { y: -90, opacity: 0, duration: 0.45, ease: "power2.in" }, 8.43);
    tl.to(".line-3", { y: -90, opacity: 0, duration: 0.45, ease: "power2.in" }, 8.51);
    tl.to(".cursor-2", { opacity: 0, duration: 0.3, ease: "power1.in" }, 8.4);
    tl.set([".scene-content", ".cursor-2"], { visibility: "hidden" }, 9.05);

    /* owl + lockup */
    tl.fromTo(".owl", { scale: 0.4, y: 70, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.7, ease: "back.out(1.6)" }, 8.95);
    tl.fromTo(".lockup", { x: -26, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 9.35);
    tl.to(".red-rule", { scaleX: 1, duration: 0.55, ease: "expo.out" }, 9.55);
    tl.fromTo(".tagline", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 9.7);
    tl.to(".owl", { y: -10, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1 }, 10.1);

    /* ---------- final fade to white for seamless loop ---------- */
    tl.to(".resolve", { opacity: 0, duration: 0.55, ease: "power2.in" }, 11.4);

    window.__timelines["root"] = tl;
  </script>
</div>
</body>
</html>
